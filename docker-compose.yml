# our-free-model 独立服务 · 纯远程拉取镜像（无 build、无本地文件依赖）
#
# 镜像已内置默认值，直接启动即可；换镜像用 OFM_IMAGE=<镜像> 覆盖（无需 .env）
#
#   docker compose up -d       启动
#   docker compose logs -f ofm 看登录链接 / 放行主机
#   docker compose down        停止（卷保留）

name: ofm

services:
  ofm:
    image: ${OFM_IMAGE:-ghcr.io/hlee-fun/our-free-model-v2.8.0:latest}
    container_name: ofm
    restart: unless-stopped

    # host 网络：容器内可见宿主局域网 IP，管理页自动透传（与 ports 互斥）
    network_mode: host

    environment:
      OFM_HOME: /data
      TZ: Asia/Shanghai
      # 容器内无 Bun 时推理会 502；此变量恢复旧传输层（不需要可删）
      OUR_FREE_MODEL_FREE_TRANSPORT: node
      # 放行访问管理页的主机：host 网络自动探测，桥接网络须手动填宿主 IP
      # OFM_TRUSTED_HOSTS: "<宿主IP>"   # 例: 192.168.1.10，多个用逗号分隔
      # OFM_ADMIN_PORT: "18900"
      # OFM_LAN_PORT: "18901"

    volumes:
      # settings.json（managementKey / LAN Key）、渠道凭据、用量统计
      - ofm-data:/data

    stop_grace_period: 20s

volumes:
  ofm-data: {}

# 桥接网络改法：注释掉 network_mode: host，加
#   ports: ["18901:18901", "18900:18900"]   # 网关对外 / 管理页（经 socat 透传后映射）
# 并取消注释 OFM_TRUSTED_HOSTS 填宿主 IP（否则管理页被上游 Host 围栏 403）
